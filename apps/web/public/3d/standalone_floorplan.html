      // 3. MAIN APP SETUP
      document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('canvas-container');

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x081018);
        scene.fog = new THREE.FogExp2(0x081018, 0.005);

        // Camera — positioned to show all 3 floors stacked
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 48, 64);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;
        controls.minDistance = 5;
        controls.maxDistance = 180;
        controls.target.set(0, 6.0, 0);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.65));

        const mainLight = new THREE.DirectionalLight(0xfff2e0, 0.95);
        mainLight.position.set(25, 55, 30);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048; mainLight.shadow.mapSize.height = 2048;
        const d = 45;
        mainLight.shadow.camera.left = -d; mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d; mainLight.shadow.camera.bottom = -d;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4fd1c2, 0.4);
        fillLight.position.set(-30, 40, -20);
        scene.add(fillLight);

        const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x182a3a, 0.6);
        scene.add(hemiLight);

        // Ground Blueprint Grid
        const gridGroup = new THREE.Group();
        const groundMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(180, 180),
          new THREE.MeshStandardMaterial({ color: 0x060c14, roughness: 0.95 })
        );
        groundMesh.rotation.x = -Math.PI / 2; groundMesh.position.y = -0.05; groundMesh.receiveShadow = true;
        gridGroup.add(groundMesh);

        const gridHelper = new THREE.GridHelper(180, 90, 0xff6b00, 0x142735);
        gridHelper.position.y = -0.04; gridHelper.material.opacity = 0.35; gridHelper.material.transparent = true;
        gridGroup.add(gridHelper);
        scene.add(gridGroup);

        // Shared Materials
        const wallMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xbcd6e6, transparent: true, opacity: 0.30, roughness: 0.35, transmission: 0.2, side: THREE.DoubleSide, depthWrite: false
        });
        const edgeMaterial = new THREE.LineBasicMaterial({ color: 0xff6b00, transparent: true, opacity: 0.8 });

        // ROOM LABEL CREATOR — canvas-texture sprite floating above each room
        function createRoomLabel(text, typeName, hexColor) {
          const canvas = document.createElement('canvas');
          const scale = 4;
          canvas.width = 256 * scale; canvas.height = 96 * scale;
          const ctx = canvas.getContext('2d');

          // Background pill
          ctx.fillStyle = 'rgba(8, 16, 24, 0.88)';
          ctx.strokeStyle = hexColor || '#ff6b00';
          ctx.lineWidth = 3 * scale;
          ctx.beginPath();
          ctx.roundRect(10 * scale, 10 * scale, canvas.width - 20 * scale, canvas.height - 20 * scale, 14 * scale);
          ctx.fill(); ctx.stroke();

          // Main label (room number / name)
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffffff';
          ctx.font = `700 ${28 * scale / 2}px 'IBM Plex Mono', monospace`;
          ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 8 * scale);

          // Subtitle (category name)
          ctx.fillStyle = hexColor || '#ff6b00';
          ctx.font = `500 ${16 * scale / 2}px 'Inter', sans-serif`;
          ctx.fillText((typeName || '').toUpperCase(), canvas.width / 2, canvas.height / 2 + 18 * scale);

          const texture = new THREE.CanvasTexture(canvas);
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
          sprite.scale.set(3.4, 1.3, 1);
          sprite.renderOrder = 999;
          return sprite;
        }

        // 4. MULTI-FLOOR BUILDER ENGINE
        const buildingRootGroup = new THREE.Group(); scene.add(buildingRootGroup);

                const floorMeshes = [];
        function buildSingleFloorGroup(roomsArray, floorLabel) {
          const fGroup = new THREE.Group();
          const corrMat = new THREE.MeshStandardMaterial({ color: 0x2b455e, roughness: 0.5, metalness: 0.15, emissive: 0x0c1a26, emissiveIntensity: 0.8 });

          roomsArray.forEach(room => {
            if (room.id === 'balcony') {
              // Semicircular West Circular Balcony (2nd floor only)
              const radius = 7.5, cx = (room.x0 + room.x1) / 2;
              const balconyWallH = 1.2;
              const balconyNode = new THREE.Group(); balconyNode.position.set(cx, 0, 0);

              const shape = new THREE.Shape(); shape.moveTo(0, -radius); shape.absarc(0, 0, radius, -Math.PI / 2, Math.PI / 2, true); shape.lineTo(0, -radius);
              const floorGeo = new THREE.ShapeGeometry(shape, 64); floorGeo.rotateX(-Math.PI / 2);
              const balconyFloorMesh = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ color: ROOM_CATEGORIES.balcony.color, roughness: 0.75 }));
                            balconyFloorMesh.position.y = 0.06;
              balconyFloorMesh.userData = room;
              floorMeshes.push(balconyFloorMesh);
              balconyNode.add(balconyFloorMesh);

              const curvedWall = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, balconyWallH, 64, 1, true, Math.PI, Math.PI), wallMaterial);
              curvedWall.position.y = balconyWallH / 2; balconyNode.add(curvedWall);
              const line = new THREE.LineSegments(new THREE.EdgesGeometry(curvedWall.geometry), edgeMaterial);
              curvedWall.add(line);

              const wallH = 3.0, t = 0.10;
              const wallN = new THREE.Mesh(new THREE.BoxGeometry(t, wallH, 6.0), wallMaterial); wallN.position.set(0, wallH / 2, 4.5); balconyNode.add(wallN);
              const wallS = new THREE.Mesh(new THREE.BoxGeometry(t, wallH, 6.0), wallMaterial); wallS.position.set(0, wallH / 2, -4.5); balconyNode.add(wallS);

              // Label above balcony
              const cat = ROOM_CATEGORIES.balcony;
              const label = createRoomLabel(room.label, cat.name, cat.hex);
              label.position.set(-radius * 0.4, 2.6, 0);
              balconyNode.add(label);

              fGroup.add(balconyNode);
              return;
            }

            const w = room.x1 - room.x0, d = room.z1 - room.z0;
            const cx = (room.x0 + room.x1) / 2, cz = (room.z0 + room.z1) / 2;
            const cat = ROOM_CATEGORIES[room.type] || ROOM_CATEGORIES.office;

            const roomNode = new THREE.Group(); roomNode.position.set(cx, 0, cz);

            // Floor mesh
            const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(w - 0.04, 0.12, d - 0.04), new THREE.MeshStandardMaterial({ color: cat.color, roughness: 0.8 }));
                        floorMesh.position.y = 0.06; floorMesh.receiveShadow = true;
            floorMesh.userData = room;
            floorMeshes.push(floorMesh);
            roomNode.add(floorMesh);

            // Walls (skip for voids — they get cross-bracing instead)
            if (room.type !== 'void') {
              const wallH = 3.0, t = 0.10;
              const wallN = new THREE.Mesh(new THREE.BoxGeometry(w, wallH, t), wallMaterial); wallN.position.set(0, wallH / 2, d / 2);
              const wallS = wallN.clone(); wallS.position.z = -d / 2;
              const wallE = new THREE.Mesh(new THREE.BoxGeometry(t, wallH, d), wallMaterial); wallE.position.set(w / 2, wallH / 2, 0);
              const wallW = wallE.clone(); wallW.position.x = -w / 2;
              [wallN, wallS, wallE, wallW].forEach(wMesh => {
                roomNode.add(wMesh);
                const line = new THREE.LineSegments(new THREE.EdgesGeometry(wMesh.geometry), edgeMaterial);
                wMesh.add(line);
              });
            } else {
              // Void cross-bracing
              const lineMat = new THREE.LineBasicMaterial({ color: 0x8f8ff0 });
              const cross1 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-w / 2 + 0.2, 0.15, -d / 2 + 0.2), new THREE.Vector3(w / 2 - 0.2, 0.15, d / 2 - 0.2)]), lineMat);
              const cross2 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-w / 2 + 0.2, 0.15, d / 2 - 0.2), new THREE.Vector3(w / 2 - 0.2, 0.15, -d / 2 + 0.2)]), lineMat);
              roomNode.add(cross1, cross2);
            }

            // ROOM LABEL — floating above every room
            const label = createRoomLabel(room.label, cat.name, cat.hex);
            label.position.set(0, 3.8, 0);
            roomNode.add(label);

            fGroup.add(roomNode);
          });

          // Solid corridor base slabs
          const nSlab = new THREE.Mesh(new THREE.BoxGeometry(49.5, 0.10, 9.5), corrMat); nSlab.position.set(3.75, 0.05, 7.0); nSlab.receiveShadow = true;
          const sSlab = new THREE.Mesh(new THREE.BoxGeometry(49.5, 0.10, 9.5), corrMat); sSlab.position.set(3.75, 0.05, -7.0); sSlab.receiveShadow = true;
          const wSlab = new THREE.Mesh(new THREE.BoxGeometry(7.0, 0.10, 9.5), corrMat); wSlab.position.set(-17.5, 0.05, 0.0); wSlab.receiveShadow = true;

        function createScissorStair(cx, cz, yStart, yEnd) {
          const stairGroup = new THREE.Group();
          const midY = (yStart + yEnd) / 2;
          const numSteps = 12;
          const stepDepth = 0.30, stepWidth = 1.1, stepHeight = (midY - yStart) / numSteps;

          for (let i = 0; i < numSteps; i++) {

            step.position.set(cx - 0.65, yStart + (i + 1) * stepHeight, cz - 2.0 + i * (3.8 / numSteps));

          }

          const landing = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.20, 1.2), landingMat);
          landing.position.set(cx, midY, cz + 2.1);
          stairGroup.add(landing);

          for (let i = 0; i < numSteps; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(stepWidth, 0.16, stepDepth), stairStepMat);
            step.position.set(cx + 0.65, midY + (i + 1) * stepHeight, cz + 1.8 - i * (3.8 / numSteps));
            stairGroup.add(step);
          }

          const topLanding = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.20, 1.2), landingMat);

          stairGroup.add(railLeft, railRight);

        }

        let isAnimating = false;

        function zoomCamera(factor) {

          transitionTo(new THREE.Vector3().addVectors(controls.target, offset), controls.target);

        function focusRoomById(roomId) {
          const allRooms = [...GROUND_FLOOR_DATA, ...FIRST_FLOOR_DATA, ...SECOND_FLOOR_DATA];
          const r = allRooms.find(rm => rm.id === roomId);
          if (!r) return;
          const cx = (r.x0 + r.x1) / 2;
          const cz = (r.z0 + r.z1) / 2;
          const y = SECOND_FLOOR_DATA.some(s => s.id === roomId) ? 12 : (FIRST_FLOOR_DATA.some(f => f.id === roomId) ? 6 : 0);
          transitionTo(new THREE.Vector3(cx, y + 16, cz + 20), new THREE.Vector3(cx, y, cz));

        // --- 3D GLOWING ROUTE LAYER & GROUND FIRE EXIT BEACON ---

        let activeRouteMesh = null;

        function clearRoute3D() {

            const obj = routeLayerGroup.children[0];
            routeLayerGroup.remove(obj);
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
              else obj.material.dispose();
            }
          }
          activeRouteMesh = null;
          activeRouteGlowMesh = null;
          groundExitBeaconGroup = null;
          isEmergencyRouteActive = false;

        function createGroundExitBeacon(x, y, z) {

        const STAIR_CORES_3D = [
          { id: 'stair-nw', name: 'Stairs NW', x: -19.25, z: 7.75, isNorth: true, isRamp: false },
          { id: 'stair-sw', name: 'Stairs SW / Ramp', x: -19.25, z: -7.75, isNorth: false, isRamp: true },
          { id: 'stair-nm', name: 'Stairs Mid-N', x: 5.75, z: 7.75, isNorth: true, isRamp: false },
          { id: 'stair-sm', name: 'Stairs Mid-S', x: 5.75, z: -7.75, isNorth: false, isRamp: false },
          { id: 'stair-ne', name: 'Stairs NE', x: 25.5, z: 7.75, isNorth: true, isRamp: false },
          { id: 'stair-se', name: 'Stairs SE', x: 25.5, z: -7.75, isNorth: false, isRamp: false }
        ];

        function setRoute3D(routePoints, options = {}) {
          clearRoute3D();
          if (!routePoints || routePoints.length < 2) return;

          const isEmergency = !!(options.isEmergency || options.profile === 'emergency');

          // Convert points to 3D coordinates
          const pts3D = [];
          for (let i = 0; i < routePoints.length; i++) {
            const pt = routePoints[i];
            let x3d = pt.x;
            let z3d = pt.y;
            if (Math.abs(pt.x) > 50 || Math.abs(pt.y) > 50) {
              x3d = (pt.x - 480) / 15;
              z3d = (242.5 - pt.y) / 15;
            }
            // Floor 2 corridor level
            pts3D.push(new THREE.Vector3(x3d, 12.25, z3d));
          }

          // If the user beacon is close to the start waypoint (< 2.5m), smoothly nudge the start to the beacon
          // without slicing across rooms/walls
          if (userBeaconGroup && userBeaconGroup.visible && pts3D.length > 0) {
            const bx = userBeaconGroup.position.x;
            const bz = userBeaconGroup.position.z;
            const distToBeacon = Math.hypot(pts3D[0].x - bx, pts3D[0].z - bz);
            if (distToBeacon < 2.5) {
              pts3D[0].x = bx;
              pts3D[0].z = bz;
            }
          }

          // Remove consecutive duplicate / nearly identical points
          const filteredPts = [];
          for (let i = 0; i < pts3D.length; i++) {
            if (i === 0 || pts3D[i].distanceTo(filteredPts[filteredPts.length - 1]) > 0.1) {
              filteredPts.push(pts3D[i].clone());
            }
          }
          if (filteredPts.length < 2) return;

          // Identify closest stair core to the route destination
          const lastCorridorPt = filteredPts[filteredPts.length - 1];
          let matchedStairCore = null;
          let minCoreDist = Infinity;
          let closestCore = null;

          for (const core of STAIR_CORES_3D) {
            const d = Math.hypot(lastCorridorPt.x - core.x, lastCorridorPt.z - core.z);
            if (d < minCoreDist) {
              minCoreDist = d;
              closestCore = core;
            }
          }

          // Strict stair route determination:
          // Must explicitly have a stair/exit destination OR be an emergency route,
          // AND must terminate near an actual stair core (<= 4.0m).
          if (options.destinationNode) {
            const destStr = String(options.destinationNode).toLowerCase();
            if (destStr.includes('stair-nw') || destStr.includes('exit-nw')) matchedStairCore = STAIR_CORES_3D.find(c => c.id === 'stair-nw');
            else if (destStr.includes('stair-sw') || destStr.includes('exit-west')) matchedStairCore = STAIR_CORES_3D.find(c => c.id === 'stair-sw');
            else if (destStr.includes('stairs-north') || destStr.includes('stair-nm') || destStr.includes('stair-mid-n')) matchedStairCore = STAIR_CORES_3D.find(c => c.id === 'stair-nm');
            else if (destStr.includes('stairs-south') || destStr.includes('stair-sm') || destStr.includes('stair-mid-s')) matchedStairCore = STAIR_CORES_3D.find(c => c.id === 'stair-sm');
            else if (destStr.includes('stair-ne') || destStr.includes('exit-east')) matchedStairCore = STAIR_CORES_3D.find(c => c.id === 'stair-ne');
            else if (destStr.includes('stairs-se') || destStr.includes('stair-se')) matchedStairCore = STAIR_CORES_3D.find(c => c.id === 'stair-se');
          }

          if (!matchedStairCore && closestCore && minCoreDist <= 4.0) {
            if (isEmergency || (options.destinationNode && /(stair|exit|ramp)/i.test(options.destinationNode))) {
              matchedStairCore = closestCore;
            }
          }

          const isStairRoute = !!matchedStairCore;
          isEmergencyRouteActive = isEmergency || isStairRoute;

          let groundExitX = lastCorridorPt.x;
          let groundExitZ = lastCorridorPt.z;

          // FOLLOW THE STAIRS DOWN TO GROUND FLOOR:
          if (isStairRoute && matchedStairCore) {
            const cx = matchedStairCore.x;
            const cz = matchedStairCore.z;

            // If the last waypoint was an abstract stair node right next to the stair core,
            // remove it so we connect seamlessly from the corridor directly into the stair entrance
            if (filteredPts.length > 1) {
              const last = filteredPts[filteredPts.length - 1];
              if (Math.hypot(last.x - cx, last.z - cz) < 3.0) {
                filteredPts.pop();
              }
            }

            if (matchedStairCore.isRamp) {
              // West Egress Ramp (ST-SW) - follows the gentle ramp slope down to Ground Floor
              filteredPts.push(new THREE.Vector3(-19.25, 12.25, -7.75));
              filteredPts.push(new THREE.Vector3(-21.5, 9.25, -5.0));
              filteredPts.push(new THREE.Vector3(-23.5, 6.25, -2.5));
              filteredPts.push(new THREE.Vector3(-25.5, 3.25, 0.0));
              filteredPts.push(new THREE.Vector3(-28.0, 0.35, 0.0));
              groundExitX = -28.5;
              groundExitZ = 0.0;
            } else if (matchedStairCore.isNorth) {
              // North Scissor Stairs (ST-NM, ST-NW, ST-NE)
              // Step into top landing from corridor
              filteredPts.push(new THREE.Vector3(cx, 12.25, cz - 2.1));
              // Flight 1: Floor 2 -> intermediate landing (y: 12.25 -> 9.15)
              filteredPts.push(new THREE.Vector3(cx + 0.65, 11.2, cz - 1.2));
              filteredPts.push(new THREE.Vector3(cx + 0.65, 10.2, cz));
              filteredPts.push(new THREE.Vector3(cx + 0.65, 9.25, cz + 1.2));
              // Intermediate landing
              filteredPts.push(new THREE.Vector3(cx, 9.15, cz + 2.1));
              // Flight 2: Intermediate landing -> Floor 1 landing (y: 9.15 -> 6.25)
              filteredPts.push(new THREE.Vector3(cx - 0.65, 8.2, cz + 1.2));
              filteredPts.push(new THREE.Vector3(cx - 0.65, 7.2, cz));
              filteredPts.push(new THREE.Vector3(cx - 0.65, 6.25, cz - 1.2));
              // Floor 1 landing
              filteredPts.push(new THREE.Vector3(cx, 6.15, cz - 2.1));
              // Flight 3: Floor 1 -> intermediate landing (y: 6.15 -> 3.15)
              filteredPts.push(new THREE.Vector3(cx + 0.65, 5.2, cz - 1.2));
              filteredPts.push(new THREE.Vector3(cx + 0.65, 4.2, cz));
              filteredPts.push(new THREE.Vector3(cx + 0.65, 3.25, cz + 1.2));
              // Intermediate landing
              filteredPts.push(new THREE.Vector3(cx, 3.15, cz + 2.1));
              // Flight 4: Intermediate landing -> Ground Floor landing (y: 3.15 -> 0.35)
              filteredPts.push(new THREE.Vector3(cx - 0.65, 2.2, cz + 1.2));
              filteredPts.push(new THREE.Vector3(cx - 0.65, 1.2, cz));
              filteredPts.push(new THREE.Vector3(cx - 0.65, 0.35, cz - 1.2));
              // Ground Floor landing
              filteredPts.push(new THREE.Vector3(cx, 0.35, cz - 2.1));
              // Egress through ground floor exterior door to outside apron
              filteredPts.push(new THREE.Vector3(cx, 0.35, cz + 4.5));
              groundExitX = cx;
              groundExitZ = cz + 5.5;
            } else {
              // South Scissor Stairs (ST-SM, ST-SE)
              // Step into top landing from corridor
              filteredPts.push(new THREE.Vector3(cx, 12.25, cz + 2.1));
              // Flight 1: Floor 2 -> intermediate landing (y: 12.25 -> 9.15)
              filteredPts.push(new THREE.Vector3(cx - 0.65, 11.2, cz + 1.2));
              filteredPts.push(new THREE.Vector3(cx - 0.65, 10.2, cz));
              filteredPts.push(new THREE.Vector3(cx - 0.65, 9.25, cz - 1.2));
              // Intermediate landing
              filteredPts.push(new THREE.Vector3(cx, 9.15, cz - 2.1));
              // Flight 2: Intermediate landing -> Floor 1 landing (y: 9.15 -> 6.25)
              filteredPts.push(new THREE.Vector3(cx + 0.65, 8.2, cz - 1.2));
              filteredPts.push(new THREE.Vector3(cx + 0.65, 7.2, cz));
              filteredPts.push(new THREE.Vector3(cx + 0.65, 6.25, cz + 1.2));
              // Floor 1 landing
              filteredPts.push(new THREE.Vector3(cx, 6.15, cz + 2.1));
              // Flight 3: Floor 1 -> intermediate landing (y: 6.15 -> 3.15)
              filteredPts.push(new THREE.Vector3(cx - 0.65, 5.2, cz + 1.2));
              filteredPts.push(new THREE.Vector3(cx - 0.65, 4.2, cz));
              filteredPts.push(new THREE.Vector3(cx - 0.65, 3.25, cz - 1.2));
              // Intermediate landing
              filteredPts.push(new THREE.Vector3(cx, 3.15, cz - 2.1));
              // Flight 4: Intermediate landing -> Ground Floor landing (y: 3.15 -> 0.35)
              filteredPts.push(new THREE.Vector3(cx + 0.65, 2.2, cz - 1.2));
              filteredPts.push(new THREE.Vector3(cx + 0.65, 1.2, cz));
              filteredPts.push(new THREE.Vector3(cx + 0.65, 0.35, cz + 1.2));
              // Ground Floor landing
              filteredPts.push(new THREE.Vector3(cx, 0.35, cz + 2.1));
              // Egress through ground floor exterior door to outside apron
              filteredPts.push(new THREE.Vector3(cx, 0.35, cz - 4.5));
              groundExitX = cx;
              groundExitZ = cz - 5.5;
            }

            // Place radiant Ground Floor Fire Exit Beacon
            groundExitBeaconGroup = createGroundExitBeacon(groundExitX, 0.25, groundExitZ);
            routeLayerGroup.add(groundExitBeaconGroup);
          }

          // Build smooth 3D CatmullRom Curve
          const curve = new THREE.CatmullRomCurve3(filteredPts, false, 'catmullrom', 0.15);

          // 1. Core Glowing Tube
          const isGlowingGreen = isEmergency || isStairRoute;
          const tubeGeo = new THREE.TubeGeometry(curve, Math.max(72, filteredPts.length * 12), isGlowingGreen ? 0.26 : 0.18, 12, false);
          const tubeMat = new THREE.MeshStandardMaterial({
            color: isGlowingGreen ? 0x00ff66 : 0x00d2ff,
            emissive: isGlowingGreen ? 0x00dd44 : 0x0077dd,
            emissiveIntensity: 1.6,
            roughness: 0.15,
            metalness: 0.2
          });
          activeRouteMesh = new THREE.Mesh(tubeGeo, tubeMat);
          routeLayerGroup.add(activeRouteMesh);

          // 2. Volumetric Glowing Aura Ribbon
          const glowTubeGeo = new THREE.TubeGeometry(curve, Math.max(72, filteredPts.length * 12), isGlowingGreen ? 0.58 : 0.42, 12, false);
          const glowTubeMat = new THREE.MeshBasicMaterial({
            color: isGlowingGreen ? 0x22c55e : 0x0099ff,
            transparent: true,
            opacity: 0.55,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide
          });
          activeRouteGlowMesh = new THREE.Mesh(glowTubeGeo, glowTubeMat);
          routeLayerGroup.add(activeRouteGlowMesh);

          // 3. Start Point Indicator
          const startPt = filteredPts[0];
          const startMarker = new THREE.Mesh(
            new THREE.SphereGeometry(0.38, 16, 16),
            new THREE.MeshBasicMaterial({ color: isGlowingGreen ? 0x00ff66 : 0x00e5ff })
          );
          startMarker.position.copy(startPt);
          routeLayerGroup.add(startMarker);
        }

        // --- HAZARD HIGHLIGHTING IN 3D ---
        const activeHazardMeshes = [];
        let hazardPointLight = null;

        function highlightHazardRoom(rawRoomId) {
          clearHazardRooms();
          const targetCode = String(rawRoomId).replace(/^(room-|ZONE_FLOOR2_)/i, '').trim();
          floorMeshes.forEach(mesh => {
            if (mesh.userData && (mesh.userData.id === targetCode || mesh.userData.id === 'room-' + targetCode)) {
              const origMat = mesh.material;
              mesh.userData._originalMaterial = origMat;
              mesh.material = new THREE.MeshStandardMaterial({
                color: 0xff2200,
                emissive: 0xff0000,
                emissiveIntensity: 1.2,
                roughness: 0.3
              });
              activeHazardMeshes.push(mesh);

              // Add flickering fire PointLight
              if (!hazardPointLight) {
                hazardPointLight = new THREE.PointLight(0xff3300, 5.0, 20, 1.2);
                hazardPointLight.position.set((mesh.userData.x0 + mesh.userData.x1) / 2, 13.5, (mesh.userData.z0 + mesh.userData.z1) / 2);
                scene.add(hazardPointLight);
              }
            }
          });
        }

        function clearHazardRooms() {
          activeHazardMeshes.forEach(mesh => {
            if (mesh.userData._originalMaterial) {
              mesh.material = mesh.userData._originalMaterial;
              delete mesh.userData._originalMaterial;
            }
          });
          activeHazardMeshes.length = 0;
          if (hazardPointLight) {
            scene.remove(hazardPointLight);
            hazardPointLight.dispose();
            hazardPointLight = null;
          }
        }

        // PostMessage API for parent PWA container
        window.addEventListener('message', (event) => {
          const msg = event.data;
          if (!msg || typeof msg !== 'object') return;

          switch (msg.type) {
            case 'PING':
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'MAP_READY' }, '*');
              }
              break;
            case 'SET_POSITION':
              updatePositionMarker(msg.position || msg.payload);
              break;
            case 'SET_ROUTE':
              setRoute3D(msg.route || msg.payload, {
                isEmergency: msg.isEmergency,
                profile: msg.profile,
                destinationNode: msg.destinationNode
              });
              break;
            case 'CLEAR_ROUTE':
              clearRoute3D();
              break;
            case 'SET_HAZARD':
              highlightHazardRoom(msg.hazard?.roomId || '208');
              break;
            case 'CLEAR_HAZARD':
              clearHazardRooms();
              break;
            case 'ZOOM_IN':
              zoomCamera(0.8);
              break;
            case 'ZOOM_OUT':
              zoomCamera(1.25);
              break;
            case 'RESET_VIEW':
              resetCamera();
              break;
            case 'FOCUS_ROOM':
              focusRoomById(msg.roomId);
              break;
          }
        });

        // Instant & Load MAP_READY notification
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'MAP_READY' }, '*');
        }
        window.addEventListener('load', () => {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'MAP_READY' }, '*');
          }
        });

        // Click raycasting
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);

          const hits = raycaster.intersectObjects(floorMeshes, false);
          if (hits.length > 0 && hits[0].object.userData && hits[0].object.userData.id) {
            const r = hits[0].object.userData;
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: 'ROOM_SELECTED',
                roomId: r.id,
                label: r.label,
                position: { x: (r.x0 + r.x1) / 2, y: (r.z0 + r.z1) / 2 }
              }, '*');
            }
          } else {
            const groundHits = raycaster.intersectObject(groundMesh, false);
            if (groundHits.length > 0 && window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: 'USER_CLICKED_MAP',
                position: { x: groundHits[0].point.x, y: groundHits[0].point.z }
              }, '*');
            }
          }
        });

        // Render Loop
        function animate() {
          requestAnimationFrame(animate);
          if (isAnimating) {
            const elapsed = performance.now() - animStartTime;
            let progress = Math.min(elapsed / animDuration, 1.0);
            progress = 1 - Math.pow(1 - progress, 3);
            camera.position.lerpVectors(startCamPos, endCamPos, progress);
            controls.target.lerpVectors(startTarget, endTarget, progress);
            if (progress >= 1.0) isAnimating = false;
          }
          if (userBeaconGroup && userBeaconGroup.visible) {
            const t = performance.now() * 0.003;
            // Pulsing PointLight intensity
            locationLight.intensity = 3.8 + Math.sin(t * 4) * 1.5;

            // Hover core, auras and badge
            const hoverY = 1.0 + Math.sin(t * 3.5) * 0.15;
            coreMesh.position.y = hoverY;
            auraMesh.position.y = hoverY;
            outerGlowMesh.position.y = hoverY;
            locationBadge.position.y = hoverY + 1.4;

            // Aura scale breathing
            const auraScale = 1.0 + Math.sin(t * 3.5) * 0.18;
            auraMesh.scale.set(auraScale, auraScale, auraScale);
            outerGlowMesh.scale.set(1.0 + Math.sin(t * 2.5) * 0.2, 1.0 + Math.sin(t * 2.5) * 0.2, 1.0 + Math.sin(t * 2.5) * 0.2);

            // Two concentric expanding ripple waves on the floor
            const r1 = 1.0 + ((t * 1.8) % 2.5);
            ringMesh1.scale.set(r1, r1, 1);
            ringMat1.opacity = Math.max(0, 0.85 - (r1 - 1.0) / 2.5);

            const r2 = 1.0 + (((t * 1.8) + 1.25) % 2.5);
            ringMesh2.scale.set(r2, r2, 1);
            ringMat2.opacity = Math.max(0, 0.65 - (r2 - 1.0) / 2.5);
          }

          // Ground Exit Beacon Animation
          if (groundExitBeaconGroup && groundExitBeaconGroup.userData) {
            const t = performance.now() * 0.003;
            const u = groundExitBeaconGroup.userData;
            u.light.intensity = 4.5 + Math.sin(t * 6) * 2.0;
            u.sphere.position.y = 1.0 + Math.sin(t * 4) * 0.15;
            const r = 1.0 + ((t * 2.0) % 2.5);
            u.ring.scale.set(r, r, 1);
            u.ringMat.opacity = Math.max(0, 0.9 - (r - 1.0) / 2.5);
          }

          // Active 3D Route Pulsating Glow
          if (activeRouteGlowMesh) {
            const t = performance.now() * 0.004;
            activeRouteGlowMesh.material.opacity = isEmergencyRouteActive
              ? 0.5 + Math.sin(t * 4) * 0.25
              : 0.4 + Math.sin(t * 3) * 0.18;
          }

          // Fire Hazard Light Flicker
          if (hazardPointLight) {
            const t = performance.now() * 0.01;
            hazardPointLight.intensity = 4.5 + Math.sin(t * 8) * 1.8 + Math.cos(t * 13) * 1.2;
          }
          controls.update();
          renderer.render(scene, camera);
        }
        animate();
      });
    })();
  </script>
</body>
</html>
