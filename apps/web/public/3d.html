      // 3. MAIN APP SETUP
      document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('canvas-container');

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x081018);
        scene.fog = new THREE.FogExp2(0x081018, 0.005);

        // Camera — positioned to show all 3 floors stacked
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 48, 64);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;
        controls.minDistance = 5;
        controls.maxDistance = 180;
        controls.target.set(0, 6.0, 0);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.65));

        const mainLight = new THREE.DirectionalLight(0xfff2e0, 0.95);
        mainLight.position.set(25, 55, 30);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048; mainLight.shadow.mapSize.height = 2048;
        const d = 45;
        mainLight.shadow.camera.left = -d; mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d; mainLight.shadow.camera.bottom = -d;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4fd1c2, 0.4);
        fillLight.position.set(-30, 40, -20);
        scene.add(fillLight);

        const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x182a3a, 0.6);
        scene.add(hemiLight);

        // Ground Blueprint Grid
        const gridGroup = new THREE.Group();
        const groundMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(180, 180),
          new THREE.MeshStandardMaterial({ color: 0x060c14, roughness: 0.95 })
        );
        groundMesh.rotation.x = -Math.PI / 2; groundMesh.position.y = -0.05; groundMesh.receiveShadow = true;
        gridGroup.add(groundMesh);

        const gridHelper = new THREE.GridHelper(180, 90, 0xff6b00, 0x142735);
        gridHelper.position.y = -0.04; gridHelper.material.opacity = 0.35; gridHelper.material.transparent = true;
        gridGroup.add(gridHelper);
        scene.add(gridGroup);

        // Shared Materials
        const wallMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xbcd6e6, transparent: true, opacity: 0.30, roughness: 0.35, transmission: 0.2, side: THREE.DoubleSide, depthWrite: false
        });
        const edgeMaterial = new THREE.LineBasicMaterial({ color: 0xff6b00, transparent: true, opacity: 0.8 });

        // ROOM LABEL CREATOR — canvas-texture sprite floating above each room
        function createRoomLabel(text, typeName, hexColor) {
          const canvas = document.createElement('canvas');
          const scale = 4;
          canvas.width = 256 * scale; canvas.height = 96 * scale;
          const ctx = canvas.getContext('2d');

          // Background pill
          ctx.fillStyle = 'rgba(8, 16, 24, 0.88)';
          ctx.strokeStyle = hexColor || '#ff6b00';
          ctx.lineWidth = 3 * scale;
          ctx.beginPath();
          ctx.roundRect(10 * scale, 10 * scale, canvas.width - 20 * scale, canvas.height - 20 * scale, 14 * scale);
          ctx.fill(); ctx.stroke();

          // Main label (room number / name)
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffffff';
          ctx.font = `700 ${28 * scale / 2}px 'IBM Plex Mono', monospace`;
          ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 8 * scale);

          // Subtitle (category name)
          ctx.fillStyle = hexColor || '#ff6b00';
          ctx.font = `500 ${16 * scale / 2}px 'Inter', sans-serif`;
          ctx.fillText((typeName || '').toUpperCase(), canvas.width / 2, canvas.height / 2 + 18 * scale);

          const texture = new THREE.CanvasTexture(canvas);
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
          sprite.scale.set(3.4, 1.3, 1);
          sprite.renderOrder = 999;
          return sprite;
        }

        // 4. MULTI-FLOOR BUILDER ENGINE
        const buildingRootGroup = new THREE.Group(); scene.add(buildingRootGroup);

                const floorMeshes = [];
        function buildSingleFloorGroup(roomsArray, floorLabel) {
          const fGroup = new THREE.Group();
          const corrMat = new THREE.MeshStandardMaterial({ color: 0x2b455e, roughness: 0.5, metalness: 0.15, emissive: 0x0c1a26, emissiveIntensity: 0.8 });

          roomsArray.forEach(room => {
            if (room.id === 'balcony') {
              // Semicircular West Circular Balcony (2nd floor only)
              const radius = 7.5, cx = (room.x0 + room.x1) / 2;
              const balconyWallH = 1.2;
              const balconyNode = new THREE.Group(); balconyNode.position.set(cx, 0, 0);

              const shape = new THREE.Shape(); shape.moveTo(0, -radius); shape.absarc(0, 0, radius, -Math.PI / 2, Math.PI / 2, true); shape.lineTo(0, -radius);
              const floorGeo = new THREE.ShapeGeometry(shape, 64); floorGeo.rotateX(-Math.PI / 2);
              const balconyFloorMesh = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ color: ROOM_CATEGORIES.balcony.color, roughness: 0.75 }));
                            balconyFloorMesh.position.y = 0.06;
              balconyFloorMesh.userData = room;
              floorMeshes.push(balconyFloorMesh);
              balconyNode.add(balconyFloorMesh);

              const curvedWall = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, balconyWallH, 64, 1, true, Math.PI, Math.PI), wallMaterial);
              curvedWall.position.y = balconyWallH / 2; balconyNode.add(curvedWall);
              const line = new THREE.LineSegments(new THREE.EdgesGeometry(curvedWall.geometry), edgeMaterial);
              curvedWall.add(line);

              const wallH = 3.0, t = 0.10;
              const wallN = new THREE.Mesh(new THREE.BoxGeometry(t, wallH, 6.0), wallMaterial); wallN.position.set(0, wallH / 2, 4.5); balconyNode.add(wallN);
              const wallS = new THREE.Mesh(new THREE.BoxGeometry(t, wallH, 6.0), wallMaterial); wallS.position.set(0, wallH / 2, -4.5); balconyNode.add(wallS);

              // Label above balcony
              const cat = ROOM_CATEGORIES.balcony;
              const label = createRoomLabel(room.label, cat.name, cat.hex);
              label.position.set(-radius * 0.4, 2.6, 0);
              balconyNode.add(label);

              fGroup.add(balconyNode);
              return;
            }

            const w = room.x1 - room.x0, d = room.z1 - room.z0;
            const cx = (room.x0 + room.x1) / 2, cz = (room.z0 + room.z1) / 2;
            const cat = ROOM_CATEGORIES[room.type] || ROOM_CATEGORIES.office;

            const roomNode = new THREE.Group(); roomNode.position.set(cx, 0, cz);

            // Floor mesh
            const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(w - 0.04, 0.12, d - 0.04), new THREE.MeshStandardMaterial({ color: cat.color, roughness: 0.8 }));
                        floorMesh.position.y = 0.06; floorMesh.receiveShadow = true;
            floorMesh.userData = room;
            floorMeshes.push(floorMesh);
            roomNode.add(floorMesh);

            // Walls (skip for voids — they get cross-bracing instead)
            if (room.type !== 'void') {
              const wallH = 3.0, t = 0.10;
              const wallN = new THREE.Mesh(new THREE.BoxGeometry(w, wallH, t), wallMaterial); wallN.position.set(0, wallH / 2, d / 2);
              const wallS = wallN.clone(); wallS.position.z = -d / 2;
              const wallE = new THREE.Mesh(new THREE.BoxGeometry(t, wallH, d), wallMaterial); wallE.position.set(w / 2, wallH / 2, 0);
              const wallW = wallE.clone(); wallW.position.x = -w / 2;
              [wallN, wallS, wallE, wallW].forEach(wMesh => {
                roomNode.add(wMesh);
                const line = new THREE.LineSegments(new THREE.EdgesGeometry(wMesh.geometry), edgeMaterial);
                wMesh.add(line);
              });
            } else {
              // Void cross-bracing
              const lineMat = new THREE.LineBasicMaterial({ color: 0x8f8ff0 });
              const cross1 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-w / 2 + 0.2, 0.15, -d / 2 + 0.2), new THREE.Vector3(w / 2 - 0.2, 0.15, d / 2 - 0.2)]), lineMat);
              const cross2 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-w / 2 + 0.2, 0.15, d / 2 - 0.2), new THREE.Vector3(w / 2 - 0.2, 0.15, -d / 2 + 0.2)]), lineMat);
              roomNode.add(cross1, cross2);
            }

            // ROOM LABEL — floating above every room
            const label = createRoomLabel(room.label, cat.name, cat.hex);
            label.position.set(0, 3.8, 0);
            roomNode.add(label);

            fGroup.add(roomNode);
          });

          // Solid corridor base slabs
          const nSlab = new THREE.Mesh(new THREE.BoxGeometry(49.5, 0.10, 9.5), corrMat); nSlab.position.set(3.75, 0.05, 7.0); nSlab.receiveShadow = true;
          const sSlab = new THREE.Mesh(new THREE.BoxGeometry(49.5, 0.10, 9.5), corrMat); sSlab.position.set(3.75, 0.05, -7.0); sSlab.receiveShadow = true;
          const wSlab = new THREE.Mesh(new THREE.BoxGeometry(7.0, 0.10, 9.5), corrMat); wSlab.position.set(-17.5, 0.05, 0.0); wSlab.receiveShadow = true;
          const mSlab = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.10, 9.5), corrMat); mSlab.position.set(7.25, 0.05, 0.0); mSlab.receiveShadow = true;
          const eSlab = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.10, 9.5), corrMat); eSlab.position.set(24.25, 0.05, 0.0); eSlab.receiveShadow = true;
          fGroup.add(nSlab, sSlab, wSlab, mSlab, eSlab);

          // Floor identifier label (big floating sign)
          const floorSign = createRoomLabel(floorLabel, 'Floor Level', '#ff6b00');
          floorSign.position.set(-32, 1.5, -14);
          floorSign.scale.set(6, 2.3, 1);
          fGroup.add(floorSign);

          // Furniture Subgroup
          const fg = new THREE.Group();
          const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 });
          const chairMat = new THREE.MeshStandardMaterial({ color: 0x1e272e });
          const porcelainMat = new THREE.MeshStandardMaterial({ color: 0xf5f6fa, roughness: 0.1 });
          const stallMat = new THREE.MeshStandardMaterial({ color: 0x718093, roughness: 0.5 });

          roomsArray.forEach(room => {
            if (room.type === 'void' || room.type === 'balcony') return;
            const w = room.x1 - room.x0, d = room.z1 - room.z0;
            const cx = (room.x0 + room.x1) / 2, cz = (room.z0 + room.z1) / 2;
            const g = new THREE.Group(); g.position.set(cx, 0, cz);

            if (room.type === 'auditorium') {
              const matTier = new THREE.MeshStandardMaterial({ color: 0xc0392b });
              const matSeat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
              for (let tier = 0; tier < 7; tier++) {
                const stepZ = -d / 2.5 + tier * (d / 8);
                const stepH = 0.2 + tier * 0.16;
                const plat = new THREE.Mesh(new THREE.BoxGeometry(w - 1.2, stepH, d / 8.5), matTier); plat.position.set(0, stepH / 2, stepZ); g.add(plat);
                for (let s = 0; s < 8; s++) {
                  const chair = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.45, 0.42), matSeat);
                  chair.position.set(-w / 2.6 + s * (w / 8.5), stepH + 0.22, stepZ); g.add(chair);
                }
              }
              const stage = new THREE.Mesh(new THREE.BoxGeometry(w - 2.0, 0.35, 1.4), new THREE.MeshStandardMaterial({ color: 0x7f8c8d }));
              stage.position.set(0, 0.175, d / 2 - 0.9); g.add(stage);
            } else if (room.type === 'mess' || room.type === 'library') {
              const matTable = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
              const matChair = new THREE.MeshStandardMaterial({ color: 0xf39c12 });
              const cols = Math.max(Math.floor(w / 2.2), 3);
              const rows = Math.max(Math.floor(d / 1.8), 2);
              for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                  const tx = -w / 2 + 1.2 + c * 2.2, tz = -d / 2 + 1.0 + r * 1.8;
                  const table = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.72, 16), matTable); table.position.set(tx, 0.36, tz); g.add(table);
                  [[-0.65,0],[0.65,0],[0,-0.65],[0,0.65]].forEach(off => {
                    const chair = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.42, 0.35), matChair); chair.position.set(tx + off[0], 0.21, tz + off[1]); g.add(chair);
                  });
                }
              }
            } else if (room.type === 'office' || room.type === 'conference') {
              const cols = Math.max(Math.floor((w - 1.2) / 1.5), 1);
              for (let r = 0; r < 3; r++) {
                for (let c = 0; c < cols; c++) {
                  const desk = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.06, 0.6), woodMat);
                  desk.position.set(-((cols - 1) * 1.5) / 2 + c * 1.5, 0.72, -d * 0.1 + r * 1.1); g.add(desk);
                  [-0.3, 0.3].forEach(cxOffset => {
                    const chair = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.4), chairMat);
                    chair.position.set(-((cols - 1) * 1.5) / 2 + c * 1.5 + cxOffset, 0.42, -d * 0.1 + r * 1.1 + 0.45); g.add(chair);
                  });
                }
              }
              const pod = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.05, 0.6), woodMat);
              pod.position.set(-w * 0.25, 0.525, -d * 0.3); g.add(pod);
            } else if (room.type === 'washroom') {
              const isMale = room.label.toLowerCase().includes('male');
              const numStalls = Math.min(Math.floor((w - 0.6) / 1.0), 4);
              for (let i = 0; i < numStalls; i++) {
                const sx = -w / 2 + 0.7 + i * 1.0;
                const part = new THREE.Mesh(new THREE.BoxGeometry(0.04, 2.0, 1.4), stallMat); part.position.set(sx + 0.5, 1.0, -d / 2 + 0.8); g.add(part);
                const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.18, 0.4, 16), porcelainMat); bowl.position.set(sx, 0.25, -d / 2 + 0.5); g.add(bowl);
                const tank = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.45, 0.2), porcelainMat); tank.position.set(sx, 0.5, -d / 2 + 0.18); g.add(tank);
              }
              const counter = new THREE.Mesh(new THREE.BoxGeometry(w * 0.65, 0.1, 0.5), stallMat); counter.position.set(0, 0.8, d / 2 - 0.4); g.add(counter);
              for (let s = 0; s < 3; s++) {
                const sink = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.12, 16), porcelainMat); sink.position.set(-w * 0.22 + s * (w * 0.22), 0.82, d / 2 - 0.4); g.add(sink);
              }
              if (isMale) {
                for (let u = 0; u < 3; u++) {
                  const ur = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, 0.2), porcelainMat); ur.position.set(-w / 2 + 0.2, 0.9, -d * 0.1 + u * 0.9); g.add(ur);
                }
              }
            }
            fg.add(g);
          });
          fGroup.add(fg);
          return fGroup;
        }

        // Build all 3 floor groups
        const groundGroup = buildSingleFloorGroup(GROUND_FLOOR_DATA, 'GROUND FLOOR');
        const floor1Group = buildSingleFloorGroup(FIRST_FLOOR_DATA, 'FIRST FLOOR');
        const floor2Group = buildSingleFloorGroup(SECOND_FLOOR_DATA, 'SECOND FLOOR');

        // Stack vertically: Ground at Y=0, 1st at Y=6, 2nd at Y=12
        groundGroup.position.set(0, 0.0, 0);
        floor1Group.position.set(0, 6.0, 0);
        floor2Group.position.set(0, 12.0, 0);

        buildingRootGroup.add(groundGroup, floor1Group, floor2Group);

        // 5. INTER-FLOOR SCISSOR STAIRS & ELEVATOR TOWERS
        const verticalConnectorsGroup = new THREE.Group();
        const glassShaftMat = new THREE.MeshPhysicalMaterial({ color: 0xdff9fb, transparent: true, opacity: 0.35, transmission: 0.85, roughness: 0.1 });
        const metalCoreMat = new THREE.MeshStandardMaterial({ color: 0xdcdde1, metalness: 0.8, roughness: 0.2 });
        const stairStepMat = new THREE.MeshStandardMaterial({ color: 0xe67e22, roughness: 0.4 });
        const landingMat = new THREE.MeshStandardMaterial({ color: 0x34495e, roughness: 0.5 });
        const columnMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });

        function createScissorStair(cx, cz, yStart, yEnd) {
          const stairGroup = new THREE.Group();
          const midY = (yStart + yEnd) / 2;
          const numSteps = 12;
          const stepDepth = 0.30, stepWidth = 1.1, stepHeight = (midY - yStart) / numSteps;

          for (let i = 0; i < numSteps; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(stepWidth, 0.16, stepDepth), stairStepMat);
            step.position.set(cx - 0.65, yStart + (i + 1) * stepHeight, cz - 2.0 + i * (3.8 / numSteps));
            stairGroup.add(step);
          }

          const landing = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.20, 1.2), landingMat);
          landing.position.set(cx, midY, cz + 2.1);
          stairGroup.add(landing);

          for (let i = 0; i < numSteps; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(stepWidth, 0.16, stepDepth), stairStepMat);
            step.position.set(cx + 0.65, midY + (i + 1) * stepHeight, cz + 1.8 - i * (3.8 / numSteps));
            stairGroup.add(step);
          }

          const topLanding = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.20, 1.2), landingMat);
          topLanding.position.set(cx, yEnd, cz - 2.1);
          stairGroup.add(topLanding);

          const railLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 4.6, 12), metalCoreMat);
          railLeft.rotation.x = Math.PI / 6; railLeft.position.set(cx - 1.2, (yStart + midY) / 2 + 0.4, cz - 0.1);
          const railRight = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 4.6, 12), metalCoreMat);
          railRight.rotation.x = -Math.PI / 6; railRight.position.set(cx + 1.2, (midY + yEnd) / 2 + 0.4, cz - 0.1);
          stairGroup.add(railLeft, railRight);

          return stairGroup;
        }

        // 6 dedicated stair/lift core positions
        const corePositions = [
          { x: -19.25, z: 7.75 },
          { x: -19.25, z: -7.75 },
          { x: 5.75, z: 7.75 },
          { x: 5.75, z: -7.75 },
          { x: 25.5, z: 7.75 },
          { x: 25.5, z: -7.75 }
        ];

        corePositions.forEach(pos => {
          verticalConnectorsGroup.add(createScissorStair(pos.x, pos.z, 0.0, 6.0));
          verticalConnectorsGroup.add(createScissorStair(pos.x, pos.z, 6.0, 12.0));

          const shaft = new THREE.Mesh(new THREE.BoxGeometry(1.6, 14.0, 1.6), glassShaftMat);
          shaft.position.set(pos.x + 0.8, 6.0, pos.z);
          verticalConnectorsGroup.add(shaft);

          [-1.2, 1.2].forEach(dx => {
            [-1.2, 1.2].forEach(dz => {
              const col = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 14.0, 12), columnMat);
              col.position.set(pos.x + dx, 6.0, pos.z + dz);
              verticalConnectorsGroup.add(col);
            });
          });
        });

        buildingRootGroup.add(verticalConnectorsGroup);

        // Window Resize Handler
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        
        // --- ROUTEGUARD ADAPTER & POSTMESSAGE HANDSHAKE ---
        const userBeaconGroup = new THREE.Group();
        const pinMat = new THREE.MeshStandardMaterial({ color: 0x007aff, roughness: 0.3, metalness: 0.1 });
        const pinHeadMat = new THREE.MeshStandardMaterial({ color: 0x00c7ff, roughness: 0.2, emissive: 0x004488, emissiveIntensity: 0.6 });
        const pinMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.02, 1.2, 16), pinMat);
        pinMesh.position.y = 0.6;
        const pinHeadMesh = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 24), pinHeadMat);
        pinHeadMesh.position.y = 1.2;
        const ringGeo = new THREE.RingGeometry(0.5, 0.9, 32);
        ringGeo.rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x007aff, transparent: true, opacity: 0.75, side: THREE.DoubleSide });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.y = 0.08;
        userBeaconGroup.add(pinMesh, pinHeadMesh, ringMesh);
        userBeaconGroup.position.set(0, 12.0, 0); // 2nd floor height
        userBeaconGroup.visible = false;
        scene.add(userBeaconGroup);

        function updatePositionMarker(pos) {
          if (!pos || typeof pos.x !== 'number' || typeof pos.y !== 'number') return;
          userBeaconGroup.position.set(pos.x, 12.0, pos.y);
          userBeaconGroup.visible = true;
        }

        let isAnimating = false;
        let animStartTime = 0;
        const animDuration = 800;
        const startCamPos = new THREE.Vector3();
        const endCamPos = new THREE.Vector3();
        const startTarget = new THREE.Vector3();
        const endTarget = new THREE.Vector3();

        function transitionTo(targetPos, targetLook) {
          startCamPos.copy(camera.position);
          endCamPos.copy(targetPos);
          startTarget.copy(controls.target);
          endTarget.copy(targetLook);
          animStartTime = performance.now();
          isAnimating = true;
        }

        function zoomCamera(factor) {
          const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
          offset.multiplyScalar(factor);
          transitionTo(new THREE.Vector3().addVectors(controls.target, offset), controls.target);
        }

        function resetCamera() {
          transitionTo(new THREE.Vector3(0, 48, 64), new THREE.Vector3(0, 6.0, 0));
        }

        function focusRoomById(roomId) {
          const allRooms = [...GROUND_FLOOR_DATA, ...FIRST_FLOOR_DATA, ...SECOND_FLOOR_DATA];
          const r = allRooms.find(rm => rm.id === roomId);
          if (!r) return;
          const cx = (r.x0 + r.x1) / 2;
          const cz = (r.z0 + r.z1) / 2;
          const y = SECOND_FLOOR_DATA.some(s => s.id === roomId) ? 12 : (FIRST_FLOOR_DATA.some(f => f.id === roomId) ? 6 : 0);
          transitionTo(new THREE.Vector3(cx, y + 16, cz + 20), new THREE.Vector3(cx, y, cz));
        }

        // PostMessage API for parent PWA container
        window.addEventListener('message', (event) => {
          const msg = event.data;
          if (!msg || typeof msg !== 'object') return;

          switch (msg.type) {
            case 'PING':
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'MAP_READY' }, '*');
              }
              break;
            case 'SET_POSITION':
              updatePositionMarker(msg.position || msg.payload);
              break;
            case 'ZOOM_IN':
              zoomCamera(0.8);
              break;
            case 'ZOOM_OUT':
              zoomCamera(1.25);
              break;
            case 'RESET_VIEW':
              resetCamera();
              break;
            case 'FOCUS_ROOM':
              focusRoomById(msg.roomId);
              break;
          }
        });

        // Instant & Load MAP_READY notification
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'MAP_READY' }, '*');
        }
        window.addEventListener('load', () => {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'MAP_READY' }, '*');
          }
        });

        // Click raycasting
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);

          const hits = raycaster.intersectObjects(floorMeshes, false);
          if (hits.length > 0 && hits[0].object.userData && hits[0].object.userData.id) {
            const r = hits[0].object.userData;
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: 'ROOM_SELECTED',
                roomId: r.id,
                label: r.label,
                position: { x: (r.x0 + r.x1) / 2, y: (r.z0 + r.z1) / 2 }
              }, '*');
            }
          } else {
            const groundHits = raycaster.intersectObject(groundMesh, false);
            if (groundHits.length > 0 && window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: 'USER_CLICKED_MAP',
                position: { x: groundHits[0].point.x, y: groundHits[0].point.z }
              }, '*');
            }
          }
        });

        // Render Loop
        function animate() {
          requestAnimationFrame(animate);
          if (isAnimating) {
            const elapsed = performance.now() - animStartTime;
            let progress = Math.min(elapsed / animDuration, 1.0);
            progress = 1 - Math.pow(1 - progress, 3);
            camera.position.lerpVectors(startCamPos, endCamPos, progress);
            controls.target.lerpVectors(startTarget, endTarget, progress);
            if (progress >= 1.0) isAnimating = false;
          }
          if (userBeaconGroup && userBeaconGroup.visible) {
            const t = performance.now() * 0.004;
            pinMesh.position.y = 1.0 + Math.sin(t * 3) * 0.2;
            pinHeadMesh.position.y = 1.6 + Math.sin(t * 3) * 0.2;
            const s = 1.0 + (Math.sin(t * 4) * 0.5 + 0.5) * 1.5;
            ringMesh.scale.set(s, s, s);
            ringMat.opacity = Math.max(0.1, 1.0 - (s - 1.0) / 1.5);
          }
          controls.update();
          renderer.render(scene, camera);
        }
        animate();
      });
    })();
  </script>
</body>
</html>
