<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RouteGuard 3D Floorplan Renderer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #081018;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
  <!-- Three.js r128 + OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    (function () {
      "use strict";

      // 1. DATA & METADATA
      const ROOM_CATEGORIES = {
        office: { name: 'Classroom / Office', color: 0xf0a24a, hex: '#f0a24a' },
        washroom: { name: 'Washroom Facilities', color: 0x4fd1c2, hex: '#4fd1c2' },
        stair: { name: 'Stairs & Elevator Core', color: 0xef6f6f, hex: '#ef6f6f' },
        void: { name: 'Lightwell Structural Void', color: 0x8f8ff0, hex: '#8f8ff0' },
        balcony: { name: 'Circular Balcony Facade', color: 0x79d189, hex: '#79d189' }
      };

      const ROOMS_DATA = [
        { id: 'stair-nw', label: 'Stairs & Lift (NW)', type: 'stair', wing: 'North Wing (West)', x0: -21.0, x1: -17.5, z0: 4.0, z1: 10.5, capacity: 'Core Passage', area: '42 m²', fixtures: ['Double Stairwell Flight', 'Glass Elevator Cab', 'Fire Exit Door'], desc: 'West end vertical egress core providing access to all floors.' },
        { id: 'wash-nw', label: 'Male Washroom', type: 'washroom', wing: 'North Wing (West)', x0: -17.5, x1: -14.0, z0: 4.0, z1: 10.5, capacity: '12 Users', area: '42 m²', fixtures: ['4 Toilet Stalls', '4 Urinals', '4 Vanity Sinks', 'Hand Dryers'], desc: 'Male sanitation facility with frosted acrylic privacy partitions.' },
        { id: '201', label: 'Room 201', type: 'office', wing: 'North Wing', x0: -14.0, x1: -9.5, z0: 4.0, z1: 10.5, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Front Lecturer Podium', 'Double Whiteboard'], desc: 'Standard academic classroom formatted with twin seating rows facing front podium.' },
        { id: '202', label: 'Room 202', type: 'office', wing: 'North Wing', x0: -9.5, x1: -5.0, z0: 4.0, z1: 10.5, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Lecturer Desk', 'Interactive Screen'], desc: 'Multimedia lecture room with digital projection.' },
        { id: '203', label: 'Room 203', type: 'office', wing: 'North Wing', x0: -5.0, x1: -0.5, z0: 4.0, z1: 10.5, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Podium', 'Whiteboard'], desc: 'Classroom featuring floor-to-ceiling glass wall panel.' },
        { id: '204', label: 'Room 204', type: 'office', wing: 'North Wing', x0: -0.5, x1: 4.0, z0: 4.0, z1: 10.5, capacity: '36 Students', area: '54 m²', fixtures: ['18 Student Desks', '36 Ergonomic Chairs', 'Lecturer Station', 'Smartboard'], desc: 'North classroom opposite central elevator core.' },
        { id: 'stair-nm', label: 'Stairs & Lift (Mid-North)', type: 'stair', wing: 'North Wing (Central)', x0: 4.0, x1: 7.5, z0: 4.0, z1: 10.5, capacity: 'Core Passage', area: '42 m²', fixtures: ['Elevator Shaft', 'Mid-Span Stairwell', 'Service Access'], desc: 'Central elevator and staircase core.' },
        { id: '205', label: 'Room 205', type: 'office', wing: 'North Wing', x0: 7.5, x1: 12.0, z0: 4.0, z1: 10.5, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Podium', 'Whiteboard'], desc: 'East classroom with corridor access.' },
        { id: '206', label: 'Room 206', type: 'office', wing: 'North Wing', x0: 12.0, x1: 16.5, z0: 4.0, z1: 10.5, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Podium', 'Whiteboard'], desc: 'Academic classroom.' },
        { id: '207', label: 'Room 207', type: 'office', wing: 'North Wing', x0: 16.5, x1: 21.0, z0: 4.0, z1: 10.5, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Projection Screen'], desc: 'Easternmost north wing classroom.' },
        { id: 'wash-ne', label: 'Female Washroom', type: 'washroom', wing: 'North Wing (East)', x0: 21.0, x1: 24.0, z0: 4.0, z1: 10.5, capacity: '12 Users', area: '36 m²', fixtures: ['6 Private Cubicles', '5 Vanity Sinks', 'Mirrors'], desc: 'Female sanitation facility.' },
        { id: 'stair-ne', label: 'Stairs & Lift (NE)', type: 'stair', wing: 'North Wing (East)', x0: 24.0, x1: 27.0, z0: 4.0, z1: 10.5, capacity: 'Fire Exit Core', area: '36 m²', fixtures: ['Emergency Staircase', 'Service Lift'], desc: 'Northeast fire exit stairwell.' },

        { id: '211', label: 'Room 211', type: 'office', wing: 'Central Island', x0: -13.5, x1: -9.5, z0: -2.5, z1: 2.5, capacity: '24 Students', area: '32 m²', fixtures: ['12 Modular Desks', '24 Task Chairs', 'Mobile Whiteboard'], desc: 'Central island seminar room overlooking lightwell 1.' },
        { id: 'void-1', label: 'Structural Lightwell [X1]', type: 'void', wing: 'Central Island', x0: -9.5, x1: -5.5, z0: -2.5, z1: 2.5, capacity: 'Open Void', area: '32 m²', fixtures: ['Cross-Bracing', 'Glass Balustrade', 'Natural Skylight'], desc: 'Triple-height open lightwell shaft.' },
        { id: '210', label: 'Room 210', type: 'office', wing: 'Central Island', x0: -5.5, x1: -1.5, z0: -2.5, z1: 2.5, capacity: '24 Students', area: '32 m²', fixtures: ['12 Student Desks', '24 Chairs', 'Whiteboard'], desc: 'Central island classroom between lightwell 1 & 2.' },
        { id: 'void-2', label: 'Structural Lightwell [X2]', type: 'void', wing: 'Central Island', x0: -1.5, x1: 2.5, z0: -2.5, z1: 2.5, capacity: 'Open Void', area: '32 m²', fixtures: ['Steel Trusses', 'Glass Railing'], desc: 'Central lightwell atrium void.' },
        { id: '212', label: 'Room 212', type: 'office', wing: 'Central Island', x0: 2.5, x1: 6.5, z0: -2.5, z1: 2.5, capacity: '24 Students', area: '32 m²', fixtures: ['12 Desks', '24 Chairs', 'AV Display Panel'], desc: 'Mid-east central island classroom.' },
        { id: '209', label: 'Room 209', type: 'office', wing: 'Central Island', x0: 6.5, x1: 10.5, z0: -2.5, z1: 2.5, capacity: '24 Students', area: '32 m²', fixtures: ['12 Desks', '24 Chairs', 'Podium'], desc: 'East central seminar room.' },
        { id: 'void-3', label: 'Structural Lightwell [X3]', type: 'void', wing: 'Central Island', x0: 10.5, x1: 14.5, z0: -2.5, z1: 2.5, capacity: 'Open Void', area: '32 m²', fixtures: ['Steel Framing', 'Skylight Enclosure'], desc: 'Eastern architectural skylight shaft.' },
        { id: '213', label: 'Room 213', type: 'office', wing: 'Central Island', x0: 14.5, x1: 18.5, z0: -2.5, z1: 2.5, capacity: '24 Students', area: '32 m²', fixtures: ['12 Desks', '24 Chairs', 'Whiteboard'], desc: 'East central island classroom.' },
        { id: '208', label: 'Room 208', type: 'office', wing: 'Central Island', x0: 18.5, x1: 22.5, z0: -2.5, z1: 2.5, capacity: '24 Students', area: '32 m²', fixtures: ['12 Desks', '24 Chairs', 'AV Screen'], desc: 'Eastern central island room.' },

        { id: 'stair-sw', label: 'Stairs & Lift (SW)', type: 'stair', wing: 'South Wing (West)', x0: -21.0, x1: -17.5, z0: -10.5, z1: -4.0, capacity: 'Core Passage', area: '42 m²', fixtures: ['Stairwell Flight', 'Elevator Cab', 'Emergency Exit'], desc: 'Southwest corner vertical circulation hub.' },
        { id: 'wash-sw', label: 'Female Washroom', type: 'washroom', wing: 'South Wing (West)', x0: -17.5, x1: -14.0, z0: -10.5, z1: -4.0, capacity: '12 Users', area: '42 m²', fixtures: ['6 Toilet Stalls', '5 Vanity Sinks', 'Full Mirrors'], desc: 'Southwest female washroom facility.' },
        { id: '220', label: 'Room 220', type: 'office', wing: 'South Wing', x0: -14.0, x1: -9.5, z0: -10.5, z1: -4.0, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Podium'], desc: 'Southwest classroom.' },
        { id: '219', label: 'Room 219', type: 'office', wing: 'South Wing', x0: -9.5, x1: -5.0, z0: -10.5, z1: -4.0, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Whiteboard'], desc: 'South wing classroom.' },
        { id: '218', label: 'Room 218', type: 'office', wing: 'South Wing', x0: -5.0, x1: -0.5, z0: -10.5, z1: -4.0, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Projection Screen'], desc: 'South wing classroom.' },
        { id: '217', label: 'Room 217', type: 'office', wing: 'South Wing', x0: -0.5, x1: 4.0, z0: -10.5, z1: -4.0, capacity: '36 Students', area: '54 m²', fixtures: ['18 Student Desks', '36 Ergonomic Chairs', 'Smartboard'], desc: 'Large south classroom facing mid-span stair core.' },
        { id: 'stair-sm', label: 'Stairs & Lift (Mid-South)', type: 'stair', wing: 'South Wing (Central)', x0: 4.0, x1: 7.5, z0: -10.5, z1: -4.0, capacity: 'Core Passage', area: '42 m²', fixtures: ['Elevator Shaft', 'Mid-Span Staircase'], desc: 'Central south staircase and lift core.' },
        { id: '216', label: 'Room 216', type: 'office', wing: 'South Wing', x0: 7.5, x1: 12.0, z0: -10.5, z1: -4.0, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Whiteboard'], desc: 'East south wing classroom.' },
        { id: '215', label: 'Room 215', type: 'office', wing: 'South Wing', x0: 12.0, x1: 16.5, z0: -10.5, z1: -4.0, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Whiteboard'], desc: 'East south wing classroom.' },
        { id: '214', label: 'Room 214', type: 'office', wing: 'South Wing', x0: 16.5, x1: 21.0, z0: -10.5, z1: -4.0, capacity: '32 Students', area: '54 m²', fixtures: ['16 Student Desks', '32 Ergonomic Chairs', 'Whiteboard'], desc: 'Easternmost south classroom.' },
        { id: 'wash-se', label: 'Male Washroom', type: 'washroom', wing: 'South Wing (East)', x0: 21.0, x1: 24.0, z0: -10.5, z1: -4.0, capacity: '12 Users', area: '36 m²', fixtures: ['4 Toilet Stalls', '4 Urinals', '4 Sinks'], desc: 'Southeast male sanitation unit.' },
        { id: 'stair-se', label: 'Stairs & Lift (SE)', type: 'stair', wing: 'South Wing (East)', x0: 24.0, x1: 27.0, z0: -10.5, z1: -4.0, capacity: 'Fire Exit Core', area: '36 m²', fixtures: ['Emergency Staircase', 'Service Lift'], desc: 'Southeast egress stairwell.' },

        { id: 'balcony', label: 'Circular Balcony', type: 'balcony', wing: 'West Facade', x0: -27.0, x1: -21.0, z0: -7.5, z1: 7.5, capacity: 'Open Terrace', area: '85 m²', fixtures: ['Curved Glass Balustrade', 'Support Columns', 'Atrium Doors', 'Grand Stairs'], desc: 'Semicircular outdoor balcony terrace on the west elevation.' }
      ];

      // 2. SCENE SETUP
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x081018);
      scene.fog = new THREE.FogExp2(0x081018, 0.008);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.position.set(0, 36, 42);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xfff2e0, 0.9);
      mainLight.position.set(25, 45, 30);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 2048;
      mainLight.shadow.mapSize.height = 2048;
      const d = 35;
      mainLight.shadow.camera.left = -d; mainLight.shadow.camera.right = d;
      mainLight.shadow.camera.top = d; mainLight.shadow.camera.bottom = -d;
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0x4fd1c2, 0.35);
      fillLight.position.set(-30, 30, -20);
      scene.add(fillLight);

      // Ground Grid
      const gridGroup = new THREE.Group();
      const groundMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(160, 160),
        new THREE.MeshStandardMaterial({ color: 0x060c14, roughness: 0.95 })
      );
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.y = -0.05;
      groundMesh.receiveShadow = true;
      gridGroup.add(groundMesh);

      const gridHelper = new THREE.GridHelper(160, 80, 0x4fd1c2, 0x142735);
      gridHelper.position.y = -0.04;
      gridHelper.material.opacity = 0.4;
      gridHelper.material.transparent = true;
      gridGroup.add(gridHelper);
      scene.add(gridGroup);

      // Orbit Controls
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.02;
      controls.minDistance = 5;
      controls.maxDistance = 120;
      controls.target.set(0, 0.5, 0);

      // Camera Smooth Flight
      let isAnimating = false;
      let animStartTime = 0;
      const animDuration = 900;
      const startCamPos = new THREE.Vector3(), startTarget = new THREE.Vector3();
      const endCamPos = new THREE.Vector3(), endTarget = new THREE.Vector3();

      function transitionTo(targetCamPos, targetLookAt) {
        startCamPos.copy(camera.position);
        startTarget.copy(controls.target);
        endCamPos.copy(targetCamPos);
        endTarget.copy(targetLookAt);
        animStartTime = performance.now();
        isAnimating = true;
      }

      // 3. BUILD FLOORPLAN STRUCTURE
      const floorGroup = new THREE.Group();
      const wallMeshes = [];
      const edgeLines = [];
      const floorMeshes = [];
      const labelSprites = [];

      const wallMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xbcd6e6,
        transparent: true,
        opacity: 0.30,
        roughness: 0.35,
        transmission: 0.2,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x4fd1c2, transparent: true, opacity: 0.8 });

      function createRoomLabel(text, typeName) {
        const canvas = document.createElement('canvas');
        const scale = 4;
        canvas.width = 256 * scale;
        canvas.height = 96 * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(8, 16, 24, 0.82)';
        ctx.strokeStyle = 'rgba(79, 209, 194, 0.6)';
        ctx.lineWidth = 3 * scale;
        ctx.beginPath();
        ctx.roundRect(10 * scale, 10 * scale, canvas.width - 20 * scale, canvas.height - 20 * scale, 14 * scale);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = `700 ${32 * scale / 2}px monospace`;
        ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 8 * scale);

        ctx.fillStyle = '#4fd1c2';
        ctx.font = `500 ${18 * scale / 2}px sans-serif`;
        ctx.fillText(typeName.toUpperCase(), canvas.width / 2, canvas.height / 2 + 18 * scale);

        const texture = new THREE.CanvasTexture(canvas);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
        sprite.scale.set(3.2, 1.2, 1);
        sprite.renderOrder = 999;
        return sprite;
      }

      ROOMS_DATA.forEach(room => {
        if (room.id === 'balcony') return;
        const w = room.x1 - room.x0, d = room.z1 - room.z0;
        const cx = (room.x0 + room.x1) / 2, cz = (room.z0 + room.z1) / 2;
        const cat = ROOM_CATEGORIES[room.type] || ROOM_CATEGORIES.office;

        const roomNode = new THREE.Group();
        roomNode.position.set(cx, 0, cz);
        roomNode.userData = room;

        // Floor Mesh
        const floorMesh = new THREE.Mesh(
          new THREE.BoxGeometry(w - 0.04, 0.12, d - 0.04),
          new THREE.MeshStandardMaterial({ color: cat.color, roughness: 0.8 })
        );
        floorMesh.position.y = 0.06;
        floorMesh.receiveShadow = true;
        floorMesh.userData = room;
        roomNode.add(floorMesh);
        floorMeshes.push(floorMesh);

        // Walls & Edge lines
        if (room.type !== 'void') {
          const wallH = 3.0, t = 0.10;
          const wallN = new THREE.Mesh(new THREE.BoxGeometry(w, wallH, t), wallMaterial);
          wallN.position.set(0, wallH / 2, d / 2);
          const wallS = wallN.clone();
          wallS.position.z = -d / 2;
          const wallE = new THREE.Mesh(new THREE.BoxGeometry(t, wallH, d), wallMaterial);
          wallE.position.set(w / 2, wallH / 2, 0);
          const wallW = wallE.clone();
          wallW.position.x = -w / 2;

          [wallN, wallS, wallE, wallW].forEach(wMesh => {
            roomNode.add(wMesh);
            wallMeshes.push(wMesh);
            const line = new THREE.LineSegments(new THREE.EdgesGeometry(wMesh.geometry), edgeMaterial);
            wMesh.add(line);
            edgeLines.push(line);
          });
        } else {
          // Void cross bracing
          const lineMat = new THREE.LineBasicMaterial({ color: 0x8f8ff0 });
          const cross1 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-w / 2 + 0.2, 0.15, -d / 2 + 0.2),
            new THREE.Vector3(w / 2 - 0.2, 0.15, d / 2 - 0.2)
          ]), lineMat);
          const cross2 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-w / 2 + 0.2, 0.15, d / 2 - 0.2),
            new THREE.Vector3(w / 2 - 0.2, 0.15, -d / 2 + 0.2)
          ]), lineMat);
          roomNode.add(cross1, cross2);
        }

        const label = createRoomLabel(room.label, cat.name);
        label.position.set(0, 3.8, 0);
        roomNode.add(label);
        labelSprites.push(label);

        floorGroup.add(roomNode);
      });

      // Corridors
      const corrMat = new THREE.MeshStandardMaterial({ color: 0x16283a, roughness: 0.9 });
      const nCorr = new THREE.Mesh(new THREE.BoxGeometry(48, 0.10, 1.5), corrMat);
      nCorr.position.set(3, 0.05, 3.25);
      const sCorr = new THREE.Mesh(new THREE.BoxGeometry(48, 0.10, 1.5), corrMat);
      sCorr.position.set(3, 0.05, -3.25);
      const wAtrium = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.10, 8.0), corrMat);
      wAtrium.position.set(-19.25, 0.05, 0);
      floorGroup.add(nCorr, sCorr, wAtrium);

      // Circular Balcony
      (function buildBalcony() {
        const balconyData = ROOMS_DATA.find(r => r.id === 'balcony');
        const radius = 7.5, cx = -21.0;
        const balconyNode = new THREE.Group();
        balconyNode.position.set(cx, 0, 0);
        balconyNode.userData = balconyData;

        const shape = new THREE.Shape();
        shape.moveTo(0, -radius);
        shape.absarc(0, 0, radius, -Math.PI / 2, Math.PI / 2, false);
        shape.lineTo(0, -radius);
        const floorGeo = new THREE.ShapeGeometry(shape, 64);
        floorGeo.rotateX(-Math.PI / 2);
        const floorMesh = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ color: ROOM_CATEGORIES.balcony.color, roughness: 0.75 }));
        floorMesh.position.y = 0.06;
        floorMesh.userData = balconyData;
        balconyNode.add(floorMesh);
        floorMeshes.push(floorMesh);

        const curvedWall = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 3.0, 64, 1, true, -Math.PI / 2, Math.PI), wallMaterial);
        curvedWall.position.y = 1.5;
        balconyNode.add(curvedWall);
        wallMeshes.push(curvedWall);
        const line = new THREE.LineSegments(new THREE.EdgesGeometry(curvedWall.geometry), edgeMaterial);
        curvedWall.add(line);
        edgeLines.push(line);

        const colMat = new THREE.MeshStandardMaterial({ color: 0xeaf2f8 });
        [-5.5, -2.5, 2.5, 5.5].forEach(zOffset => {
          const col = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 3.0, 16), colMat);
          const angle = Math.asin(zOffset / radius);
          col.position.set(-radius * Math.cos(angle) + 0.3, 1.5, zOffset);
          balconyNode.add(col);
        });

        const label = createRoomLabel('Circular Balcony', 'Circulation');
        label.position.set(-radius * 0.5, 3.8, 0);
        balconyNode.add(label);
        labelSprites.push(label);
        floorGroup.add(balconyNode);
      })();

      scene.add(floorGroup);

      // 4. FURNITURE & FIXTURES
      const furnitureGroup = new THREE.Group();
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 });
      const chairMat = new THREE.MeshStandardMaterial({ color: 0x1e272e });
      const metalMat = new THREE.MeshStandardMaterial({ color: 0xdcdde1 });

      ROOMS_DATA.forEach(room => {
        if (room.id === 'balcony' || room.type === 'void') return;
        const w = room.x1 - room.x0, d = room.z1 - room.z0;
        const cx = (room.x0 + room.x1) / 2, cz = (room.z0 + room.z1) / 2;
        const g = new THREE.Group();
        g.position.set(cx, 0, cz);

        if (room.type === 'office') {
          const cols = Math.floor((w - 1.2) / 1.5);
          for (let r = 0; r < 3; r++) {
            for (let c = 0; c < cols; c++) {
              const desk = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.06, 0.6), woodMat);
              desk.position.set(-((cols - 1) * 1.5) / 2 + c * 1.5, 0.72, -d * 0.1 + r * 1.1);
              g.add(desk);
            }
          }
          const pod = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.05, 0.6), woodMat);
          pod.position.set(-w * 0.25, 0.525, -d * 0.3);
          g.add(pod);
        } else if (room.type === 'washroom') {
          const counter = new THREE.Mesh(new THREE.BoxGeometry(w * 0.7, 0.1, 0.5), chairMat);
          counter.position.set(0, 0.8, d / 2 - 0.4);
          g.add(counter);
        } else if (room.type === 'stair') {
          for (let i = 0; i < 8; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 0.28), metalMat);
            step.position.set(-w * 0.25, i * 0.15 + 0.075, -d * 0.35 + i * 0.28);
            g.add(step);
          }
        }
        furnitureGroup.add(g);
      });
      scene.add(furnitureGroup);

      // 5. DYNAMIC OVERLAYS (USER BEACON, ROUTES, HAZARDS, SMOKE, AVATARS)
      // A. User Position Beacon
      const userBeaconGroup = new THREE.Group();
      userBeaconGroup.visible = false;
      scene.add(userBeaconGroup);

      const pinGeo = new THREE.ConeGeometry(0.45, 1.4, 16);
      pinGeo.rotateX(Math.PI);
      const pinMat = new THREE.MeshStandardMaterial({
        color: 0x00a8ff,
        emissive: 0x0055ff,
        emissiveIntensity: 0.9,
        roughness: 0.2
      });
      const pinMesh = new THREE.Mesh(pinGeo, pinMat);
      pinMesh.position.y = 1.8;
      userBeaconGroup.add(pinMesh);

      const pinHeadGeo = new THREE.SphereGeometry(0.35, 16, 16);
      const pinHeadMat = new THREE.MeshStandardMaterial({
        color: 0x4fd1c2,
        emissive: 0x4fd1c2,
        emissiveIntensity: 1.0
      });
      const pinHeadMesh = new THREE.Mesh(pinHeadGeo, pinHeadMat);
      pinHeadMesh.position.y = 2.4;
      userBeaconGroup.add(pinHeadMesh);

      const ringGeo = new THREE.RingGeometry(0.4, 0.8, 32);
      ringGeo.rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x4fd1c2,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.85
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.position.y = 0.12;
      userBeaconGroup.add(ringMesh);

      function parseCoord(val, isY) {
        if (typeof val !== 'number') return 0;
        // SVG coordinate mapping fallback
        if (val > 50) {
          return isY ? (242.5 - val) / 15 : (val - 480) / 15;
        }
        return val;
      }

      function updatePositionMarker(pos) {
        if (!pos) return;
        const x3d = parseCoord(pos.x3d !== undefined ? pos.x3d : pos.x, false);
        const z3d = parseCoord(pos.z3d !== undefined ? pos.z3d : (pos.z !== undefined ? pos.z : pos.y), true);
        userBeaconGroup.position.set(x3d, 0, z3d);
        userBeaconGroup.visible = true;
      }

      // B. Route Overlay
      const routeGroup = new THREE.Group();
      scene.add(routeGroup);

      function updateRouteOverlay(route) {
        clearRouteOverlay();
        if (!route) return;
        const points = Array.isArray(route) ? route : (route.pathPoints || route.points || []);
        if (points.length < 2) return;

        const vectors = points.map(pt => {
          const x = parseCoord(pt.x3d !== undefined ? pt.x3d : pt.x, false);
          const z = parseCoord(pt.z3d !== undefined ? pt.z3d : (pt.z !== undefined ? pt.z : pt.y), true);
          return new THREE.Vector3(x, 0.25, z);
        });

        const curve = new THREE.CatmullRomCurve3(vectors);
        const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.15, 8, false);
        const tubeMat = new THREE.MeshStandardMaterial({
          color: 0x4fd1c2,
          emissive: 0x1f9d92,
          roughness: 0.3
        });
        const routeMesh = new THREE.Mesh(tubeGeo, tubeMat);
        routeGroup.add(routeMesh);
      }

      function clearRouteOverlay() {
        while (routeGroup.children.length > 0) {
          const child = routeGroup.children[0];
          routeGroup.remove(child);
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
      }

      // C. Hazard Overlays
      const hazardsMap = new Map();

      function setHazard(hazard) {
        if (!hazard) return;
        const id = hazard.id || hazard.roomId || 'hazard-default';
        clearHazard(id);

        const roomId = hazard.roomId || hazard.id;
        const targetRoom = ROOMS_DATA.find(r => r.id === roomId);
        if (!targetRoom) return;

        const cx = (targetRoom.x0 + targetRoom.x1) / 2;
        const cz = (targetRoom.z0 + targetRoom.z1) / 2;
        const w = targetRoom.x1 - targetRoom.x0;
        const d = targetRoom.z1 - targetRoom.z0;

        const hGroup = new THREE.Group();
        hGroup.position.set(cx, 0, cz);

        // Highlight floor box in pulsating red
        const hFloorGeo = new THREE.BoxGeometry(w, 0.14, d);
        const hFloorMat = new THREE.MeshStandardMaterial({
          color: 0xff3b30,
          emissive: 0xff3b30,
          emissiveIntensity: 0.6,
          roughness: 0.5
        });
        const hFloor = new THREE.Mesh(hFloorGeo, hFloorMat);
        hFloor.position.y = 0.08;
        hGroup.add(hFloor);

        scene.add(hGroup);
        hazardsMap.set(id, hGroup);
      }

      function clearHazard(id) {
        const hGroup = hazardsMap.get(id);
        if (hGroup) {
          scene.remove(hGroup);
          hazardsMap.delete(id);
        }
      }

      // D. Smoke Forecast
      const smokeGroup = new THREE.Group();
      scene.add(smokeGroup);

      function updateSmokeForecast(forecast) {
        while (smokeGroup.children.length > 0) {
          const child = smokeGroup.children[0];
          smokeGroup.remove(child);
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
        if (!forecast) return;

        const minutes = typeof forecast === 'number' ? forecast : (forecast.minutes || 0);
        if (minutes <= 0) return;

        const r = minutes === 2 ? 3.5 : minutes === 5 ? 7.0 : 12.0;
        const smokeGeo = new THREE.SphereGeometry(r, 16, 16);
        const smokeMat = new THREE.MeshStandardMaterial({
          color: 0x11161f,
          transparent: true,
          opacity: 0.5,
          roughness: 0.95
        });
        const smokeMesh = new THREE.Mesh(smokeGeo, smokeMat);
        // Default epicenter at IoT Lab 208
        smokeMesh.position.set(20.5, 1.5, 0);
        smokeGroup.add(smokeMesh);
      }

      // E. User Avatars
      const avatarsGroup = new THREE.Group();
      scene.add(avatarsGroup);

      function updateUserAvatars(users) {
        while (avatarsGroup.children.length > 0) {
          const child = avatarsGroup.children[0];
          avatarsGroup.remove(child);
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
        if (!Array.isArray(users)) return;

        users.forEach(u => {
          const x = parseCoord(u.position ? (u.position.x3d || u.position.x) : u.x, false);
          const z = parseCoord(u.position ? (u.position.z3d || u.position.z || u.position.y) : (u.z || u.y), true);
          const avGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.6, 16);
          const avMat = new THREE.MeshStandardMaterial({ color: 0xf0a24a, emissive: 0xf0a24a, emissiveIntensity: 0.5 });
          const avMesh = new THREE.Mesh(avGeo, avMat);
          avMesh.position.set(x, 0.8, z);
          avatarsGroup.add(avMesh);
        });
      }

      // F. Focus Room By ID
      function focusRoomById(roomId, animate) {
        const room = ROOMS_DATA.find(r => r.id === roomId);
        if (!room) return;
        const cx = (room.x0 + room.x1) / 2;
        const cz = (room.z0 + room.z1) / 2;
        const roomWidth = room.x1 - room.x0;
        const roomDepth = room.z1 - room.z0;
        const dist = Math.max(roomWidth, roomDepth) * 2.8;

        const targetCam = new THREE.Vector3(cx, dist * 0.9, cz + dist * 0.9);
        const targetLook = new THREE.Vector3(cx, 0.8, cz);

        if (animate !== false) {
          transitionTo(targetCam, targetLook);
        } else {
          camera.position.copy(targetCam);
          controls.target.copy(targetLook);
        }
      }

      // G. Mode Setter
      function setMode(mode) {
        if (mode === 'emergency') {
          ambientLight.intensity = 0.45;
          mainLight.color.setHex(0xffaaaa);
        } else {
          ambientLight.intensity = 0.65;
          mainLight.color.setHex(0xfff2e0);
        }
      }

      // H. Clear All
      function clearAllOverlays() {
        clearRouteOverlay();
        hazardsMap.forEach((_, id) => clearHazard(id));
        updateSmokeForecast(0);
        updateUserAvatars([]);
        userBeaconGroup.visible = false;
        setMode('normal');
      }

      // 6. POSTMESSAGE API FOR PARENT <-> IFRAME
      const ALLOWED_ORIGINS = [
        window.location.origin,
        'http://localhost:5173',
        'http://localhost:3000',
        'https://muj-wifi-bssid-mapper.vercel.app'
      ];

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin && !ALLOWED_ORIGINS.includes(event.origin) && event.origin !== '*') {
          return;
        }
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;

        switch (msg.type) {
          case 'PING':
            event.source.postMessage({
              type: 'MAP_READY',
              rooms: ROOMS_DATA.map(r => ({ id: r.id, label: r.label, type: r.type, x0: r.x0, x1: r.x1, z0: r.z0, z1: r.z1 }))
            }, event.origin || '*');
            break;
          case 'SET_POSITION':
            updatePositionMarker(msg.position || msg.payload);
            break;
          case 'SET_ROUTE':
            updateRouteOverlay(msg.route || msg.payload);
            break;
          case 'CLEAR_ROUTE':
            clearRouteOverlay();
            break;
          case 'SET_HAZARD':
            setHazard(msg.hazard || msg.payload);
            break;
          case 'CLEAR_HAZARD':
            clearHazard(msg.id || msg.payload);
            break;
          case 'SET_SMOKE_FORECAST':
            updateSmokeForecast(msg.forecast || msg.payload);
            break;
          case 'SET_USERS':
            updateUserAvatars(msg.users || msg.payload);
            break;
          case 'FOCUS_ROOM':
            focusRoomById(msg.roomId, msg.animate !== false);
            break;
          case 'SET_MODE':
            setMode(msg.mode || msg.payload);
            break;
          case 'CLEAR_ALL':
            clearAllOverlays();
            break;
        }
      });

      // Signal readiness on load
      window.addEventListener('load', () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'MAP_READY',
            rooms: ROOMS_DATA.map(r => ({ id: r.id, label: r.label, type: r.type, x0: r.x0, x1: r.x1, z0: r.z0, z1: r.z1 }))
          }, '*');
        }
      });

      // Emit on room click
      function emitRoomSelected(roomData) {
        const cx = (roomData.x0 + roomData.x1) / 2;
        const cz = (roomData.z0 + roomData.z1) / 2;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'ROOM_SELECTED',
            roomId: roomData.id,
            label: roomData.label,
            position: { x: cx, y: cz }
          }, '*');
        }
      }

      // 7. INTERACTION & RAYCASTING
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('click', e => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(floorMeshes, false);
        if (hits.length > 0 && hits[0].object.userData && hits[0].object.userData.id) {
          emitRoomSelected(hits[0].object.userData);
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // 8. RENDER LOOP
      function animate() {
        requestAnimationFrame(animate);
        if (isAnimating) {
          const elapsed = performance.now() - animStartTime;
          let progress = Math.min(elapsed / animDuration, 1.0);
          progress = 1 - Math.pow(1 - progress, 3);
          camera.position.lerpVectors(startCamPos, endCamPos, progress);
          controls.target.lerpVectors(startTarget, endTarget, progress);
          if (progress >= 1.0) isAnimating = false;
        }

        if (userBeaconGroup.visible) {
          const t = performance.now() * 0.003;
          pinMesh.position.y = 1.8 + Math.sin(t * 3) * 0.22;
          pinHeadMesh.position.y = 2.4 + Math.sin(t * 3) * 0.22;
          const s = 1.0 + (Math.sin(t * 4) * 0.5 + 0.5) * 1.8;
          ringMesh.scale.set(s, s, s);
          ringMat.opacity = Math.max(0.1, 1.0 - (s - 1.0) / 1.8);
        }

        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
